name: Build & Test Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Contract
        run: |
          cd contracts/niko_project
          cargo build --target wasm32v1-none --release

      - name: Run Tests
        run: |
          cd contracts/niko_project
          cargo test

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: niko-project-wasm
          path: contracts/niko_project/target/wasm32v1-none/release/*.wasm

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run lint
        run: |
          cd frontend
          npm run lint
