name: CI

on:
  push:
    branches:
      - main
      - "integracion/**"
  pull_request:
    branches:
      - main

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain fijado (el mismo del build local) para que el hash del wasm sea reproducible
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32v1-none
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run contract tests
        run: cargo test --locked

      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets -- -D warnings

      # soroban-sdk 28 no compila con `cargo build` a secas: exige `stellar contract build`
      # (Stellar CLI >= 25.2). Se usa el binario oficial de la release 28.0.0.
      - name: Install Stellar CLI 28.0.0
        run: |
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          curl -sSfL https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/stellar-cli"
          BIN="$(find "$RUNNER_TEMP/stellar-cli" -type f -name stellar | head -1)"
          chmod +x "$BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Build release WASM
        run: stellar contract build

      - name: Print WASM checksum
        run: sha256sum target/wasm32v1-none/release/niko_project.wasm

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No lint step here: the repo has no ESLint config, and `npm run lint` (next lint)
      # would try to prompt interactively to create one, which hangs/fails in CI.
      # Re-add a lint step once an eslint config (e.g. eslint.config.mjs) is committed.

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build (static export)
        run: npm run build
