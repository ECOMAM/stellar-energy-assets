name: CI

on:
  push:
    branches:
      - main
      - "integracion/**"
  pull_request:
    branches:
      - main

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run contract tests
        run: cargo test --locked

      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release WASM
        run: cargo build --locked --target wasm32v1-none --release

      - name: Print WASM checksum
        run: sha256sum target/wasm32v1-none/release/niko_project.wasm

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No lint step here: the repo has no ESLint config, and `npm run lint` (next lint)
      # would try to prompt interactively to create one, which hangs/fails in CI.
      # Re-add a lint step once an eslint config (e.g. eslint.config.mjs) is committed.

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build (static export)
        run: npm run build
